    <style>
        :root { --gold: #d4af37; --gold-light: #f9d976; }
        
        /* CLAVE: touch-action: pan-y 
           Permite hacer scroll arriba y abajo, pero bloquea el "pellizco" (zoom) en toda la web.
        */
        body { 
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; 
            background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; 
            background-size: cover; 
            overflow-x: hidden;
            touch-action: pan-y; 
        }
        
        body::before { 
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%); 
            z-index: -1; 
        }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 10px 40px; background: rgba(0,0,0,0.9); }
        .header-logo { height: 105px; width: auto; filter: brightness(0) saturate(100%) invert(75%) sepia(50%) saturate(600%) hue-rotate(5deg) brightness(90%) contrast(100%); cursor: pointer; transition: 0.3s; }
        #logo-izq { animation: giro-3d 6s linear infinite; }
        #logo-der { animation: giro-3d 6s linear infinite reverse; }
        @keyframes giro-3d { from { transform: perspective(1000px) rotateY(0deg); } to { transform: perspective(1000px) rotateY(360deg); } }

        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-left { justify-content: flex-start; }
        .icons-right { justify-content: flex-end; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); transform: translateY(-3px); }

        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; margin: 5px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:hover, .btn.activo { background: white; transform: scale(1.05); }

        /* REJILLA GALERÍA */
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; max-width: 1300px; margin: auto; }
        .foto-card { position: relative; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 10px; border: 1px solid #333; background: #111; display: flex; align-items: center; justify-content: center; }
        .foto-card img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: pointer; transition: 0.4s; display: block; touch-action: manipulation; }
        .foto-card img:hover { transform: scale(1.1); filter: brightness(1.2); }

        /* MODAL / VISOR PROFESIONAL */
        #imageModal { 
            display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.98); align-items: center; justify-content: center;
            overflow: auto;
        }
        
        #imgFull { 
            max-width: 95%; max-height: 80vh; border: 2px solid var(--gold); border-radius: 5px; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); object-fit: contain; 
            /* CLAVE: Permite "pellizcar" SOLO en esta imagen */
            touch-action: pinch-zoom; 
            transition: transform 0.2s ease-out; /* Suaviza el zoom que vamos a hacer por JS */
            transform-origin: center center;
        }

        .modal-btn { position: absolute; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: white; font-size: 2.5rem; cursor: pointer; transition: 0.3s; padding: 10px 20px; z-index: 100000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-btn:hover { background: var(--gold); color: black; }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }
        #closeBtn { top: 20px; right: 20px; font-size: 2rem; width: 50px; height: 50px; }

        /* SECCIÓN COMENTARIOS */
        .seccion-comentarios { max-width: 800px; margin: 30px auto; padding: 20px; background: white; color: black; border-radius: 10px; border: 2px solid var(--gold); }

        /* SECCIÓN BACKSTAGE */
        .backstage-box { background: linear-gradient(45deg, #111, #222); border: 2px solid var(--gold); padding: 40px 20px; text-align: center; border-radius: 15px; margin: 50px auto; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .backstage-box h2 { color: var(--gold); text-transform: uppercase; margin-top: 0; margin-bottom: 10px; }
        .backstage-box p { color: #ccc; margin-bottom: 25px; font-size: 1.1rem; }
        .backstage-form { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .backstage-input { padding: 12px 20px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; width: 300px; font-family: 'Montserrat', sans-serif; }
        .btn-subscribe { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        
        #btnSubir { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--gold); color: black; border: none; cursor: pointer; width: 55px; height: 55px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.6); justify-content: center; align-items: center; font-size: 1.5rem; }

        @media (max-width: 768px) { 
            header { flex-direction: column; padding: 20px; gap: 15px; } 
            .header-logo { display: none; } 
            .social-icons { width: auto; justify-content: center; } 
            .btn { font-size: 0.7rem; padding: 8px 10px; }
            .modal-btn { font-size: 1.8rem; padding: 10px; width: 45px; height: 45px; background: rgba(0,0,0,0.7); }
            #imgFull { max-height: 70vh; }
            .backstage-input { width: 100%; }
        }
    </style>
</head>

<div id="imageModal">
    <button class="modal-btn" id="closeBtn" onclick="cerrarModal()">×</button>
    <button class="modal-btn" id="prevBtn" onclick="cambiarFoto(-1)">❮</button>
    
    <div id="zoomContainer" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%; touch-action: none;">
        <img id="imgFull" src="" alt="Vista ampliada">
    </div>
    
    <button class="modal-btn" id="nextBtn" onclick="cambiarFoto(1)">❯</button>
</div>

<script>
    const totalFotos = 178;
    const contenedor = document.getElementById('galeria-fotos');
    let fotoActual = 1;
    let escalaActual = 1; // Control de zoom inicial

    function cargarGaleria() {
        let contenido = "";
        for (let i = 1; i <= totalFotos; i++) { 
            contenido += `
                <div class="foto-card">
                    <img src="Fotos/Foto ${i}.jpg" 
                         loading="lazy" 
                         alt="Tony Vázquez - Foto ${i}" 
                         onclick="abrirImagen(${i})">
                </div>`; 
        }
        contenedor.innerHTML = contenido;
    }

    function abrirImagen(indice) {
        fotoActual = indice;
        escalaActual = 1; // Reiniciar zoom al abrir
        document.getElementById("imgFull").style.transform = `scale(${escalaActual})`;
        actualizarImagenModal();
        document.getElementById("imageModal").style.display = "flex";
        document.body.style.overflow = "hidden"; // Bloquea el scroll del fondo
    }

    function cerrarModal() {
        document.getElementById("imageModal").style.display = "none";
        document.body.style.overflow = "auto"; // Devuelve el scroll al fondo
        escalaActual = 1; // Reiniciar zoom
        document.getElementById("imgFull").style.transform = `scale(1)`;
    }

    function cambiarFoto(direccion) {
        fotoActual += direccion;
        if (fotoActual > totalFotos) fotoActual = 1;
        if (fotoActual < 1) fotoActual = totalFotos;
        escalaActual = 1; // Reiniciar zoom al cambiar de foto
        document.getElementById("imgFull").style.transform = `scale(1)`;
        actualizarImagenModal();
    }

    function actualizarImagenModal() {
        const imagenFull = document.getElementById("imgFull");
        imagenFull.src = `Fotos/Foto ${fotoActual}.jpg`;
    }

    // Cerrar al hacer clic fuera de la foto o en los botones (si el zoom es 1)
    document.getElementById("imageModal").onclick = function(e) {
        if (e.target.id === "imageModal" || e.target.id === "zoomContainer") {
            cerrarModal();
        }
    };

    document.addEventListener('keydown', function(e) {
        if (document.getElementById("imageModal").style.display === "flex") {
            if (e.key === "ArrowLeft") cambiarFoto(-1);
            if (e.key === "ArrowRight") cambiarFoto(1);
            if (e.key === "Escape") cerrarModal();
        }
    });

    window.onscroll = function() { 
        let btn = document.getElementById("btnSubir");
        if (document.documentElement.scrollTop > 400) { btn.style.display = "flex"; } else { btn.style.display = "none"; }
    };

    // --- SCRIPT PARA EL ZOOM TÁCTIL (Pinch to Zoom) SOLO EN LA IMAGEN ---
    const imgElement = document.getElementById('imgFull');
    let inicioPellizco = 0;

    imgElement.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            inicioPellizco = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
        }
    }, {passive: false});

    imgElement.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2) {
            e.preventDefault(); // Evitar el comportamiento nativo raro de Safari/Chrome
            let pellizcoActual = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
            
            // Calcular nueva escala (sensibilidad ajustada)
            let delta = (pellizcoActual - inicioPellizco) * 0.01; 
            escalaActual += delta;
            
            // Limitar el zoom (entre 1x normal y 4x máximo)
            if(escalaActual < 1) escalaActual = 1;
            if(escalaActual > 4) escalaActual = 4;
            
            imgElement.style.transform = `scale(${escalaActual})`;
            inicioPellizco = pellizcoActual;
        }
    }, {passive: false});

    cargarGaleria();
</script>
