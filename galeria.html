        :root { --gold: #d4af37; --gold-light: #f9d976; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; background-size: cover; overflow-x: hidden; touch-action: pan-y; }

        .header-center h1 { font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 0; text-transform: uppercase; text-shadow: 2px 2px 10px black; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 4px; font-weight: 700; font-size: 0.8rem; }
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-left { justify-content: flex-start; }
        .icons-right { justify-content: flex-end; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); transform: translateY(-3px); }
        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; margin: 5px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:hover, .btn.activo { background: white; transform: scale(1.05); }
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; max-width: 1300px; margin: auto; }
        .foto-card { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid #333; background: #111; display: flex; align-items: center; justify-content: center; }
        .foto-card img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; transition: 0.4s; display: block; touch-action: manipulation; }
        .foto-card img:hover { transform: scale(1.05); filter: brightness(1.2); }
        #imageModal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.98); align-items: center; justify-content: center; overflow: auto; }
        #imgFull { width: 100%; height: 100%; max-height: 85vh; border: 2px solid var(--gold); border-radius: 5px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); object-fit: contain; touch-action: pinch-zoom; transition: transform 0.2s ease-out; transform-origin: center center; }
        .modal-btn { position: absolute; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: white; font-size: 2.5rem; cursor: pointer; transition: 0.3s; padding: 10px 20px; z-index: 100000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .modal-btn:hover { background: var(--gold); color: black; }
        #prevBtn { left: 20px; }
        #nextBtn { right: 20px; }
        #closeBtn { top: 20px; right: 20px; font-size: 2rem; width: 50px; height: 50px; }

        /* SECCION COMENTARIOS COMPACTA, MÁS ANCHA EN PC Y MENOS ALTA */
        .seccion-comentarios { 
            width: 95%;
            max-width: 800px; 
            margin: 30px auto; 
            padding: 15px 20px 10px 20px; 
            background: rgba(15, 15, 15, 0.95); 
            color: white; 
            border-radius: 15px; 
            border: 1px solid var(--gold); 
            box-sizing: border-box;
        }
        .caja-reacciones { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-reaccion { 
            background: #222; 
            border: 1px solid var(--gold); 
            border-radius: 10px; 
            padding: 6px 12px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: 0.3s; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .btn-reaccion:hover { transform: scale(1.05); background: rgba(212, 175, 55, 0.1); }
        .btn-reaccion.votado { background: var(--gold); color: black; border-color: black; cursor: default; transform: none; }
        .btn-reaccion span { font-size: 1.1rem; }
        
        #btnSubir { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--gold); color: black; border: none; cursor: pointer; width: 55px; height: 55px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.6); justify-content: center; align-items: center; font-size: 1.5rem; transition: 0.3s; }
        @media (max-width: 768px) { header { flex-direction: column; padding: 20px; gap: 15px; } .header-logo { display: none; } .social-icons { width: auto; justify-content: center; } .btn { font-size: 0.7rem; padding: 8px 10px; } .modal-btn { font-size: 1.8rem; padding: 10px; width: 45px; height: 45px; background: rgba(0,0,0,0.7); } #imgFull { max-height: 70vh; } }
    </style>

<div class="grid-galeria" id="galeria-fotos"></div>

<div class="seccion-comentarios">
    <h3 style="color: var(--gold); text-align: center; text-transform: uppercase; margin: 0 0 10px 0; font-size: 1.1rem;">¿Qué te parece la galería? ¡Reacciona! 👇</h3>
    <div class="caja-reacciones">
        <button class="btn-reaccion" onclick="sumarReaccion('fuego', this)">🔥 <span id="count-fuego">0</span></button>
        <button class="btn-reaccion" onclick="sumarReaccion('cuernos', this)">🤘 <span id="count-cuernos">0</span></button>
        <button class="btn-reaccion" onclick="sumarReaccion('corazon', this)">😍 <span id="count-corazon">0</span></button>
    </div>
    <hr style="border: 0.5px solid var(--gold); opacity: 0.2; margin: 15px 0;">
    <h3 style="color: var(--gold); text-align: center; text-transform: uppercase; margin: 0 0 10px 0; font-size: 1rem; opacity: 0.8;">O deja tu mensaje rockero 🎸</h3>
    <div id="cusdis_thread" 
         data-host="https://cusdis.com" 
         data-app-id="b3a46067-e248-4f1a-8f3b-1d829f5606c3" 
         data-page-id="galeria_tony_vazquez" 
         data-page-url="https://www.tonyvazquez.es/galeria.html" 
         data-page-title="Galeria Tony Vazquez"
         data-theme="dark"></div>
    <script defer src="https://cusdis.com/js/widget/lang/es.js"></script>
    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
</div>

<footer style="text-align:center; padding: 40px;"><p>© 2026 Tony Vázquez. Todos los derechos reservados.</p></footer>

<button id="btnSubir" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

<div id="imageModal">
    <button class="modal-btn" id="closeBtn" onclick="cerrarModal()">×</button>
    <button class="modal-btn" id="prevBtn" onclick="cambiarFoto(-1)">❮</button>
    <div id="zoomContainer" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%; touch-action: none;"><img id="imgFull" src=""></div>
    <button class="modal-btn" id="nextBtn" onclick="cambiarFoto(1)">❯</button>
</div>

<script>
    // --- CONTADORES SEPARADOS ---
    const totalClasicas = 179; 
    const totalNuevas = 0;     

    const contenedor = document.getElementById('galeria-fotos'); 
    let fotoActual = 1; 
    let escalaActual = 1;
    let ordenFotos = []; 

    function cargarGaleria() { 
        let contenido = ""; 
        ordenFotos = []; 

        if (totalNuevas >= 200) { 
            for (let i = totalNuevas; i >= 200; i--) { 
                ordenFotos.push(i); 
                contenido += `<div class="foto-card"><img src="Fotos/Foto ${i}.jpg" loading="lazy" onclick="abrirImagen(${i})"></div>`; 
            } 
        }

        for (let i = 1; i <= totalClasicas; i++) { 
            ordenFotos.push(i); 
            contenido += `<div class="foto-card"><img src="Fotos/Foto ${i}.jpg" loading="lazy" onclick="abrirImagen(${i})"></div>`; 
        } 

        contenedor.innerHTML = contenido; 
    }

    function abrirImagen(indice) { fotoActual = indice; escalaActual = 1; document.getElementById("imgFull").style.transform = `scale(1)`; actualizarImagenModal(); document.getElementById("imageModal").style.display = "flex"; document.body.style.overflow = "hidden"; }
    function cerrarModal() { document.getElementById("imageModal").style.display = "none"; document.body.style.overflow = "auto"; }
    
    function cambiarFoto(direccion) { 
        let index = ordenFotos.indexOf(fotoActual); 
        index += direccion; 
        
        if (index >= ordenFotos.length) index = 0; 
        if (index < 0) index = ordenFotos.length - 1; 
        
        fotoActual = ordenFotos[index]; 
        escalaActual = 1; 
        document.getElementById("imgFull").style.transform = `scale(1)`; 
        actualizarImagenModal(); 
    }

    function actualizarImagenModal() { document.getElementById("imgFull").src = `Fotos/Foto ${fotoActual}.jpg`; }
    
    function cargarReacciones() {
        const api = 'https://abacus.jasoncameron.dev'; const site = 'tonyvazquez.es';
        ['fuego', 'cuernos', 'corazon'].forEach(tipo => {
            fetch(`${api}/get/${site}/react_${tipo}`).then(r => r.json()).then(d => { document.getElementById(`count-${tipo}`).innerText = d.value || 0; });
            if(localStorage.getItem(`voto_${tipo}`)) { document.getElementById(`count-${tipo}`).parentElement.classList.add('votado'); }
        });
    }

    function sumarReaccion(tipo, btn) {
        if(localStorage.getItem(`voto_${tipo}`)) return; localStorage.setItem(`voto_${tipo}`, 'true'); btn.classList.add('votado');
        let span = document.getElementById(`count-${tipo}`); span.innerText = (parseInt(span.innerText) || 0) + 1;
        fetch(`https://abacus.jasoncameron.dev/hit/tonyvazquez.es/react_${tipo}`);
    }

    window.onscroll = function() { 
        let btn = document.getElementById("btnSubir"); 
        if (document.documentElement.scrollTop > 400) { btn.style.display = "flex"; } else { btn.style.display = "none"; } 
    };

    document.addEventListener('DOMContentLoaded', () => { cargarGaleria(); cargarReacciones(); });
</script>
