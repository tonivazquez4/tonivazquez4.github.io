<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #000 url('Alma de Rock.jpg') no-repeat center fixed; background-size: cover; color: white; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: -1; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 10px 40px; background: rgba(0,0,0,0.8); }
        .header-logo { height: 105px; filter: brightness(0) saturate(100%) invert(75%) sepia(50%) saturate(600%) hue-rotate(5deg); }
        #logo-izq { animation: giro-3d 6s linear infinite; }
        #logo-der { animation: giro-3d 6s linear infinite reverse; }
        @keyframes giro-3d { from { transform: perspective(1000px) rotateY(0deg); } to { transform: perspective(1000px) rotateY(360deg); } }
        .nav-menu { text-align: center; margin: 25px 0; }
        .btn { background: var(--gold); color: black; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 5px; display: inline-block; }
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .foto-card img { width: 100%; height: 300px; object-fit: contain; background: #000; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .foto-card img:hover { transform: scale(1.05); border: 1px solid var(--gold); }
        .seccion-comentarios { max-width: 800px; margin: 30px auto; padding: 20px; background: white; color: black; border-radius: 10px; border: 2px solid var(--gold); }
        @media (max-width: 768px) { .header-logo { display: none; } .nav-menu { display: flex; justify-content: center; } .btn { font-size: 0.7rem; } }
    </style>
</head>
<body>
<header>
    <img src="logoTV.png" class="header-logo" id="logo-izq">
    <div style="text-align:center"><h1>TONY VÁZQUEZ</h1><p style="color:var(--gold)">GALERÍA</p></div>
    <img src="logoTV.png" class="header-logo" id="logo-der">
</header>
<nav class="nav-menu">
    <a href="index.html" class="btn">Inicio</a>
    <a href="galeria.html" class="btn" style="background:#fff">Galería</a>
    <a href="videos.html" class="btn">Vídeos</a>
</nav>
<div class="grid-galeria" id="galeria-fotos"></div>
<div class="seccion-comentarios">
    <h3>¿Qué te parecen las fotos? 📸</h3>
    <div id="disqus_thread"></div>
    <script>
        var disqus_config = function () { this.page.url = "https://www.tonyvazquez.es/galeria.html"; this.page.identifier = "galeria_tony_vazquez"; };
        (function() { var d = document, s = d.createElement('script'); s.src = 'https://tony-vazquez.disqus.com/embed.js'; s.setAttribute('data-timestamp', +new Date()); (d.head || d.body).appendChild(s); })();
    </script>
</div>
<script>
    const totalFotos = 177;
    const contenedor = document.getElementById('galeria-fotos');
    for (let i = 1; i <= totalFotos; i++) {
        contenedor.innerHTML += `<div class="foto-card"><img src="Fotos/Foto ${i}.jpg" loading="lazy"></div>`;
    }
</script>
</body>
</html>
