<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1YS8QY8TXN"></script>
    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --gold: #d4af37; }
        body { font-family: 'Arial Black', sans-serif; margin: 0; padding: 0; color: white; background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; background-size: cover; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: -1; }
        
        header { 
            height: 120px; 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold); 
            padding: 0 40px; 
            background: rgba(0,0,0,0.6); 
        }
        
        .header-logo {
            height: 105px; 
            width: auto; 
            /* TRUCO PARA BLANCO PURO AL 100% */
            filter: brightness(0) invert(100%);
        }
        
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-left { justify-content: flex-start; }
        .icons-right { justify-content: flex-end; }
        
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); }
        
        .header-center { text-align: center; }
        .header-center h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); color: white; text-transform: uppercase; margin: 0; text-shadow: 2px 2px 10px black; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 3px; font-weight: bold; font-size: 0.8rem; }

        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: var(--gold); color: black; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; transition: 0.3s; }
        .btn:hover { background: white; transform: scale(1.05); }

        .container { padding: 0 20px 20px; max-width: 1400px; margin: auto; }
        .grid-galeria { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .foto-card { background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 10px; overflow: hidden; cursor: zoom-in; }
        
        .foto-card img { width: 100%; height: 300px; object-fit: contain; background-color: #000; display: block; transition: 0.3s; }
        .foto-card img:hover { opacity: 0.8; }

        .seccion-comentarios { max-width: 900px; margin: 40px auto 60px; padding: 20px; background: rgba(255, 255, 255, 0.95); border-radius: 10px; border: 2px solid var(--gold); }
        .seccion-comentarios h3 { color: black; text-align: center; margin-top: 0; font-size: 1.5rem; text-transform: uppercase; border-bottom: 2px solid #ccc; padding-bottom: 10px; }

        /* MODAL Y CARRUSEL */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.95); 
            align-items: center; 
            justify-content: center;
        }
        
        .contenido-modal { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
            max-width: 95vw; 
            max-height: 95vh; 
            object-fit: contain; 
            border: none; 
            box-shadow: none;
        }

        .cerrar { 
            position: absolute; 
            top: 20px; 
            right: 35px; 
            color: white; 
            font-size: 40px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            z-index: 1001;
        }
        .cerrar:hover { color: var(--gold); }

        .nav-modal {
            cursor: pointer; 
            position: absolute; 
            top: 50%; 
            transform: translateY(-50%);
            width: auto; 
            padding: 16px; 
            color: white; 
            font-weight: bold; 
            font-size: 40px; 
            transition: 0.3s ease; 
            user-select: none; 
            background: rgba(0,0,0,0.5); 
            border: none;
            z-index: 1001;
            border-radius: 5px;
        }
        .nav-modal:hover { background-color: var(--gold); color: black; }
        .prev { left: 20px; }
        .next { right: 20px; }

        footer { padding: 30px; text-align: center; background: rgba(0,0,0,0.9); border-top: 1px solid #222; }

        #btnSubir {
            display: none; 
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99;
            font-size: 1.5rem;
            border: none;
            outline: none;
            background-color: var(--gold);
            color: black;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        #btnSubir:hover { background-color: white; transform: scale(1.1); }

        @media (max-width: 900px) {
            header { flex-direction: column; height: auto; padding: 20px; gap: 15px; }
            .header-logo { display: none; } 
            .social-icons { width: auto; justify-content: center; margin: 0; }
            .nav-menu { display: flex; flex-direction: row; justify-content: center; flex-wrap: nowrap; gap: 5px; }
            .nav-menu .btn { width: auto; max-width: none; margin: 0; padding: 8px 10px; font-size: 0.8rem; }
            .grid-galeria { grid-template-columns: repeat(2, 1fr); }
            .foto-card img { height: 250px; }
            .seccion-comentarios { margin: 20px 15px 60px; }
            #btnSubir { bottom: 20px; right: 20px; width: 45px; height: 45px; font-size: 1.2rem; }
            
            /* Ajustes para los botones del modal en móviles */
            .nav-modal { font-size: 25px; padding: 10px; }
            .prev { left: 5px; }
            .next { right: 5px; }
            .cerrar { top: 10px; right: 20px; font-size: 30px; }
        }
    </style>
</head>
<body>

<div id="fb-root"></div>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_ES/sdk.js#xfbml=1&version=v19.0&appId=1282552559929333"></script>

<header>
    <img src="logoTV.png" alt="Tony Vázquez Logo" class="header-logo"> 

    <div class="social-icons icons-left">
        <a href="https://open.spotify.com/intl-es/artist/5PGFsB4rJcNb9h5gBOKnWw/discography/all" target="_blank"><i class="fa-brands fa-spotify"></i></a>
        <a href="https://music.apple.com/es/artist/tony-vazquez/1497948014" target="_blank"><i class="fa-brands fa-apple"></i></a>
        <a href="https://music.youtube.com/channel/UCFNdFbrM3s0kznhCGpRJ3GA" target="_blank"><i class="fa-brands fa-youtube"></i></a>
    </div>
    
    <div class="header-center">
        <h1>TONY VÁZQUEZ</h1>
        <p>ROCK · ALMA · LEYENDA</p>
    </div>
    
    <div class="social-icons icons-right">
        <a href="https://music.amazon.es/artists/B07NFBKRHJ/tony-vazquez" target="_blank"><i class="fa-brands fa-amazon"></i></a>
        <a href="https://instagram.com/tonykubo" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.facebook.com/tonisampler/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
    </div>

    <img src="logoTV.png" alt="Tony Vázquez Logo" class="header-logo">
</header>

<nav class="nav-menu">
    <a href="index.html" class="btn">Inicio</a>
    <a href="galeria.html" class="btn">Galería de fotos</a>
    <a href="videos.html" class="btn">Vídeos</a>
</nav>

<div class="container">
    <div id="galeria-fotos" class="grid-galeria"></div>
</div>

<div class="seccion-comentarios">
    <h3>Deja tu comentario sobre las fotos 📸</h3>
    <div class="fb-comments" data-href="https://www.tonyvazquez.es/galeria.html" data-width="100%" data-numposts="5"></div>
</div>

<footer>
    <p>© 2026 Tony Vázquez. Todos los derechos reservados.</p>
</footer>

<div id="modal-galeria" class="modal" onclick="cerrarModal(event)">
    <span class="cerrar" onclick="cerrarModal(event, true)">×</span>
    <button class="nav-modal prev" onclick="cambiarImagen(-1, event)">❮</button>
    <img class="contenido-modal" id="imagen-ampliada" onclick="event.stopPropagation()">
    <button class="nav-modal next" onclick="cambiarImagen(1, event)">❯</button>
</div>

<button id="btnSubir" onclick="subirArriba()" title="Volver arriba">
    <i class="fa-solid fa-arrow-up"></i>
</button>

<script>
    const totalFotos = 156;
    let indiceActual = 1;
    const contenedor = document.getElementById('galeria-fotos');
    
    for (let i = 1; i <= totalFotos; i++) {
        const div = document.createElement('div');
        div.className = 'foto-card';
        const ruta = "Fotos/Foto " + i + ".jpg";
        div.innerHTML = `<img src="${encodeURI(ruta)}" loading="lazy" onclick="abrirModal(${i}); event.stopPropagation();">`;
        contenedor.appendChild(div);
    }

    function abrirModal(index) {
        indiceActual = index;
        actualizarImagenModal();
        document.getElementById('modal-galeria').style.display = 'flex';
    }

    function actualizarImagenModal() {
        const ruta = "Fotos/Foto " + indiceActual + ".jpg";
        document.getElementById('imagen-ampliada').src = encodeURI(ruta);
    }

    function cambiarImagen(direccion, event) {
        if(event) event.stopPropagation();
        
        indiceActual += direccion;
        
        if (indiceActual > totalFotos) {
            indiceActual = 1;
        } else if (indiceActual < 1) {
            indiceActual = totalFotos;
        }
        
        actualizarImagenModal();
    }

    function cerrarModal(event, forzar = false) {
        if (forzar || event.target.id === 'modal-galeria') {
            document.getElementById('modal-galeria').style.display = 'none';
        }
    }

    document.addEventListener('keydown', function(event) {
        const modal = document.getElementById('modal-galeria');
        if (modal.style.display === 'flex') {
            if (event.key === 'ArrowRight') {
                cambiarImagen(1);
            } else if (event.key === 'ArrowLeft') {
                cambiarImagen(-1);
            } else if (event.key === 'Escape') {
                cerrarModal(event, true);
            }
        }
    });

    let miBoton = document.getElementById("btnSubir");
    window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            miBoton.style.display = "flex";
        } else {
            miBoton.style.display = "none";
        }
    };
    function subirArriba() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
</script>

</body>
