    <style>
        :root { --gold: #d4af37; --gold-light: #f9d976; }

        header { height: 120px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 0 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.5)); }
        .header-logo { height: 105px; width: auto; filter: brightness(0) invert(100%); }
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .social-icons a { color: white; font-size: 1.4rem; transition: transform 0.3s; text-decoration: none; }
        .social-icons a:hover { color: var(--gold); transform: translateY(-3px); }
        .header-center { text-align: center; }
        .header-center h1 { font-size: clamp(1.2rem, 4vw, 2.5rem); margin: 0; text-transform: uppercase; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 3px; font-weight: 700; font-size: 0.8rem; }
        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; margin: 5px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:hover, .btn.activo { background: linear-gradient(45deg, #ffffff, #e0e0e0); transform: scale(1.05); }
        
        .container { padding: 0 20px 20px; max-width: 1400px; margin: auto; }
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .foto-card { background: #111; border: 1px solid #444; border-radius: 10px; overflow: hidden; cursor: zoom-in; transition: 0.4s; }
        .foto-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4); border-color: var(--gold); }
        .foto-card img { width: 100%; height: 300px; object-fit: contain; background: black; display: block; }

        .seccion-comentarios { 
            max-width: 800px; margin: 30px auto 50px; padding: 15px 20px; 
            background-color: #ffffff; 
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(240, 240, 240, 0.95)); 
            border-radius: 10px; border: 2px solid var(--gold); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .seccion-comentarios h3 { color: black; text-align: center; margin-top: 0; font-size: 1.3rem; text-transform: uppercase; border-bottom: 2px solid #ccc; padding-bottom: 10px; }

        footer { padding: 25px; text-align: center; background: #000; border-top: 2px solid #222; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .contenido-modal { width: 95vw; height: 95vh; object-fit: contain; }
        .cerrar { position: absolute; top: 20px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
        #btnSubir { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; background: var(--gold); border-radius: 50%; width: 50px; height: 50px; border: none; cursor: pointer; }

<div id="modal-galeria" class="modal" onclick="this.style.display='none'">
    <span class="cerrar">×</span>
    <img class="contenido-modal" id="imagen-ampliada">
</div>

<button id="btnSubir" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

<script>
    const totalFotos = 177;
    const contenedor = document.getElementById('galeria-fotos');
    for (let i = 1; i <= totalFotos; i++) {
        const div = document.createElement('div');
        div.className = 'foto-card';
        div.innerHTML = `<img src="Fotos/Foto ${i}.jpg" loading="lazy" onclick="abrirModal(${i})">`;
        contenedor.appendChild(div);
    }
    function abrirModal(i) { document.getElementById('imagen-ampliada').src = `Fotos/Foto ${i}.jpg`; document.getElementById('modal-galeria').style.display = 'flex'; }
    window.onscroll = function() { document.getElementById("btnSubir").style.display = (window.scrollY > 300) ? "block" : "none"; };
</script>

<div id="cookie-banner" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.98); border-top: 2px solid var(--gold); padding: 20px; z-index: 10000; text-align: center;">
    <p style="color: #ddd; margin-bottom: 15px;">Usamos cookies para mejorar tu experiencia rockera. 🤘</p>
    <button onclick="aceptarCookies()" style="background: var(--gold); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Aceptar todo</button>
</div>
<script>
    if (!localStorage.getItem("cookiesAceptadas")) document.getElementById("cookie-banner").style.display = "block";
    function aceptarCookies() { localStorage.setItem("cookiesAceptadas", "true"); document.getElementById("cookie-banner").style.display = "none"; }
</script>
