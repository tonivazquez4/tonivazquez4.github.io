<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --rock-red: #b31d1d; --gold: #d4af37; }
        
        body { 
            font-family: 'Arial Black', sans-serif; 
            margin: 0; padding: 0; color: white;
            background: url('Alma de Rock.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: -1;
        }

        header { 
            min-height: 100px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold);
            padding: 10px 40px;
            background: rgba(0,0,0,0.6);
        }

        h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); color: white; text-transform: uppercase; margin: 0; }
        header p { margin: 2px 0 0; letter-spacing: 2px; font-size: 0.8rem; color: var(--gold); }
        
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-right { justify-content: flex-end; }
        .icons-left { justify-content: flex-start; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); }

        .page-title { text-align: center; margin-top: 30px; }
        .page-title h2 { color: var(--gold); text-transform: uppercase; font-size: 2.2rem; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; margin: 0; }
        
        .nav-menu { text-align: center; margin: 20px 0 40px; }
        .btn { background: var(--gold); color: black; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; font-size: 0.9rem; transition: 0.3s; }
        .btn:hover { transform: scale(1.05); background: white; }

        .container { padding: 0 15px 60px; max-width: 1300px; margin: auto; }
        
        /* CUADRÍCULA DE FOTOS */
        .grid-galeria { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
        }

        .foto-card { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            transition: 0.4s;
        }

        .foto-card:hover { 
            border-color: var(--gold); 
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .foto-card img { 
            width: 100%; 
            height: 300px; 
            object-fit: cover; /* Todas las fotos iguales como un mosaico */
            display: block; 
            cursor: pointer;
            filter: grayscale(30%); /* Efecto rockero */
            transition: 0.3s;
        }

        .foto-card:hover img { filter: grayscale(0%); }

        footer { padding: 30px; text-align: center; background: rgba(0,0,0,0.9); font-size: 0.8rem; border-top: 1px solid #222; }

        @media (max-width: 768px) {
            header { flex-direction: column; height: auto; padding: 20px; gap: 10px; }
            .social-icons { width: auto; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="social-icons icons-left">
        <a href="#"><i class="fa-brands fa-spotify"></i></a>
        <a href="#"><i class="fa-brands fa-apple"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <div>
        <h1>TONY VÁZQUEZ</h1>
        <p>ROCK · ALMA · LEYENDA</p>
    </div>

    <div class="social-icons icons-right">
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
    </div>
</header>

<div class="page-title">
    <h2>Galería de Fotos</h2>
</div>

<nav class="nav-menu">
    <a href="index.html" class="btn">Inicio</a>
    <a href="galeria.html" class="btn">Galería</a>
    <a href="videos.html" class="btn">Vídeos</a>
</nav>

<div class="container">
    <div id="galeria-dinamica" class="grid-galeria"></div>
</div>

<footer>
    <p>© 2026 Tony Vázquez. Todos los derechos reservados.</p>
</footer>

<script>
    // Configuración: pon aquí el número de fotos que tienes en la carpeta
    const numeroDeFotos = 50; 
    const contenedor = document.getElementById('galeria-dinamica');

    // Bucle para crear las 50 fotos automáticamente
    for (let i = 1; i <= numeroDeFotos; i++) {
        const card = document.createElement('div');
        card.className = 'foto-card';
        
        // Asumimos que tus fotos se llaman foto1.jpg, foto2.jpg, etc.
        card.innerHTML = `<img src="foto${i}.jpg" alt="Tony Vázquez Foto ${i}" loading="lazy">`;
        
        contenedor.appendChild(card);
    }
</script>

</body>
</html>
