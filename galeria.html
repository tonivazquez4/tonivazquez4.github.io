    <style>
        /* REGLA DE ORO: Evita que las cajas se hinchen y se salgan en el móvil */
        * { box-sizing: border-box; }

        :root { --gold: #d4af37; --gold-light: #f9d976; }
        
        body { 
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; 
            background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; 
            background-size: cover; overflow-x: hidden; touch-action: pan-y; 
        }
        
        body::before { 
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%); 
            z-index: -1; 
        }

        /* Ocultar banner si ya estamos en la App */
        @media (display-mode: standalone) {
            #ios-install-banner { display: none !important; }
        }

        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 10px 20px; background: rgba(0,0,0,0.9); width: 100%; }
        
        .header-logo { height: 80px; width: auto; filter: invert(75%) sepia(50%) saturate(600%) hue-rotate(5deg); cursor: pointer; transition: 0.3s; }
        @media (min-width: 1024px) { .header-logo { height: 105px; } }

        #logo-izq { animation: giro-3d 6s linear infinite; }
        #logo-der { animation: giro-3d 6s linear infinite reverse; }
        @keyframes giro-3d { from { transform: perspective(1000px) rotateY(0deg); } to { transform: perspective(1000px) rotateY(360deg); } }

        .header-center { text-align: center; flex-grow: 1; padding: 0 10px; }
        .header-center h1 { font-size: clamp(1rem, 4vw, 1.8rem); margin: 0; text-transform: uppercase; text-shadow: 2px 2px 10px black; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 2px; font-weight: 700; font-size: 0.7rem; }

        .social-icons { display: flex; gap: 10px; }
        .social-icons a { color: white; font-size: 1.2rem; text-decoration: none; transition: 0.3s; }
        
        .nav-menu { text-align: center; margin: 20px 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; }
        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 8px 15px; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:hover, .btn.activo { background: white; transform: scale(1.05); }

        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 1300px; margin: auto; }
        .foto-card { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid #333; background: #111; overflow: hidden; }
        .foto-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: 0.4s; }
        .foto-card img:hover { transform: scale(1.05); }

        /* MURO ROCKERO RESPONSIVO */
        .muro-rockero {
            width: 95%;
            max-width: 480px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(15, 15, 15, 0.95);
            border-radius: 15px;
            border: 1px solid var(--gold);
            color: white;
            box-sizing: border-box;
        }

        @media (min-width: 1024px) {
            .muro-rockero { max-width: 1000px; padding: 30px; }
        }

        /* Modal Galería */
        #imageModal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.98); align-items: center; justify-content: center; }
        #imgFull { max-width: 95%; max-height: 85vh; border: 2px solid var(--gold); object-fit: contain; }
        
        .modal-btn { position: absolute; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: white; font-size: 2rem; cursor: pointer; z-index: 100000; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        #prevBtn { left: 10px; }
        #nextBtn { right: 10px; }
        #closeBtn { top: 10px; right: 10px; }

        footer { text-align: center; padding: 30px; background: #000; border-top: 1px solid #222; font-size: 0.8rem; }
        
        #btnSubir { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: var(--gold); color: black; border: none; width: 50px; height: 50px; border-radius: 50%; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 15px; gap: 10px; }
            .header-logo { display: none; }
            .grid-galeria { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); padding: 10px; }
        }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>

<div class="grid-galeria" id="galeria-fotos"></div>

<div class="muro-rockero">
    <h3 style="color: var(--gold); text-align: center; text-transform: uppercase; margin-top: 0; font-size: 1.1rem;">¿Qué te parece? ¡Reacciona! 🤘</h3>
    <div class="caja-reacciones" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 25px;">
        <button class="btn-reaccion" onclick="sumarReaccion('fuego', this)" style="background:#222; border:1px solid var(--gold); color:white; padding:8px 12px; border-radius:10px; cursor:pointer;">🔥 <span id="count-fuego">0</span></button>
        <button class="btn-reaccion" onclick="sumarReaccion('cuernos', this)" style="background:#222; border:1px solid var(--gold); color:white; padding:8px 12px; border-radius:10px; cursor:pointer;">🤘 <span id="count-cuernos">0</span></button>
        <button class="btn-reaccion" onclick="sumarReaccion('corazon', this)" style="background:#222; border:1px solid var(--gold); color:white; padding:8px 12px; border-radius:10px; cursor:pointer;">😍 <span id="count-corazon">0</span></button>
    </div>
    <hr style="border: 0.5px solid var(--gold); opacity: 0.2; margin: 20px 0;">

<div id="ios-install-banner" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:92%; max-width:400px; background:rgba(20,20,20,0.98); border:2px solid var(--gold); border-radius:12px; padding:20px; color:white; z-index:999999; text-align:center; box-shadow: 0 0 20px rgba(0,0,0,1);">
    <button onclick="cerrarBannerIos()" style="position:absolute; top:5px; right:10px; background:none; border:none; color:white; font-size:1.8rem; cursor:pointer;">×</button>
    <p style="margin:0 0 10px 0; font-weight:bold; color:var(--gold); font-size:1.1rem;">📲 Instala la App Oficial</p>
    <p style="margin:0; font-size:0.85rem; line-height:1.4;">Añade la galería a tu pantalla de inicio para acceso rápido 🤘</p>
</div>

<div id="imageModal">
    <button class="modal-btn" id="closeBtn" onclick="cerrarModal()">×</button>
    <button class="modal-btn" id="prevBtn" onclick="cambiarFoto(-1)">❮</button>
    <img id="imgFull" src="">
    <button class="modal-btn" id="nextBtn" onclick="cambiarFoto(1)">❯</button>
</div>

<button id="btnSubir" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

<script defer src="https://cusdis.com/js/widget/lang/es.js"></script>
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>

<script>
    const totalFotos = 178; const contenedor = document.getElementById('galeria-fotos'); let fotoActual = 1;
    function cargarGaleria() { let contenido = ""; for (let i = 1; i <= totalFotos; i++) { contenido += `<div class="foto-card"><img src="Fotos/Foto ${i}.jpg" loading="lazy" onclick="abrirImagen(${i})"></div>`; } contenedor.innerHTML = contenido; }
    function abrirImagen(indice) { fotoActual = indice; actualizarImagenModal(); document.getElementById("imageModal").style.display = "flex"; document.body.style.overflow = "hidden"; }
    function cerrarModal() { document.getElementById("imageModal").style.display = "none"; document.body.style.overflow = "auto"; }
    function cambiarFoto(direccion) { fotoActual += direccion; if (fotoActual > totalFotos) fotoActual = 1; if (fotoActual < 1) fotoActual = totalFotos; actualizarImagenModal(); }
    function actualizarImagenModal() { document.getElementById("imgFull").src = `Fotos/Foto ${fotoActual}.jpg`; }
    
    // BANNER MEMORIA
    function cerrarBannerIos() {
        document.getElementById('ios-install-banner').style.display = 'none';
        localStorage.setItem('pwa_banner_closed_date', new Date().getTime());
    }

    window.onload = function() {
        cargarGaleria();
        const closedDate = localStorage.getItem('pwa_banner_closed_date');
        const now = new Date().getTime();
        if (!(closedDate && (now - closedDate < 7 * 24 * 60 * 60 * 1000)) && !window.matchMedia('(display-mode: standalone)').matches) {
            setTimeout(() => { document.getElementById('ios-install-banner').style.display = 'block'; }, 3000);
        }
    };

    window.onscroll = function() { 
        let btn = document.getElementById("btnSubir"); 
        btn.style.display = (document.documentElement.scrollTop > 400) ? "flex" : "none"; 
    };

    function sumarReaccion(tipo, btn) {
        if(localStorage.getItem(`voto_${tipo}`)) return;
        localStorage.setItem(`voto_${tipo}`, 'true');
        btn.style.background = "var(--gold)"; btn.style.color = "black";
        let span = document.getElementById(`count-${tipo}`);
        span.innerText = (parseInt(span.innerText) || 0) + 1;
    }
</script>
