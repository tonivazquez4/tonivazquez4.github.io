<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root { --rock-red: #b31d1d; --gold: #d4af37; }
        
        body { 
            font-family: 'Arial Black', sans-serif; 
            margin: 0; padding: 0; color: white;
            background: url('Alma de Rock.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: -1;
        }

        header { 
            height: 100px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold);
            padding: 0 40px;
        }

        h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); color: white; text-transform: uppercase; margin: 0; }
        header p { margin: 2px 0 0; letter-spacing: 2px; font-size: 0.8rem; color: var(--gold); }
        
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-right { justify-content: flex-end; }
        .icons-left { justify-content: flex-start; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); }

        /* TÍTULO Y MENÚ */
        .page-title { text-align: center; margin-top: 30px; }
        .page-title h2 { color: var(--gold); text-transform: uppercase; font-size: 2.2rem; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; margin: 0; }
        
        .nav-menu { text-align: center; margin: 20px 0 40px; }
        .btn { background: var(--gold); color: black; padding: 8px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; font-size: 0.9rem; }

        .container { padding: 0 15px 40px; max-width: 1200px; margin: auto; }
        
        .grid-galeria { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }

        .foto-card { background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 10px; overflow: hidden; }
        .foto-card img { width: 100%; height: 350px; object-fit: contain; display: block; padding: 10px; }

        footer { padding: 20px; text-align: center; background: rgba(0,0,0,0.9); font-size: 0.8rem; border-top: 1px solid #222; }

        @media (max-width: 768px) {
            header { flex-direction: column; height: auto; padding: 20px; gap: 10px; }
            .social-icons { width: auto; justify-content: center; }
        }
    </style>
</head>
<body>

<header>
    <div class="social-icons icons-left">
        <a href="https://open.spotify.com/intl-es/artist/5PGFsB4rJcNb9h5gBOKnWw/discography/all" target="_blank"><i class="fa-brands fa-spotify"></i></a>
        <a href="#" target="_blank"><i class="fa-brands fa-apple"></i></a>
        <a href="#" target="_blank"><i class="fa-brands fa-youtube"></i></a>
    </div>

    <div>
        <h1>TONY VÁZQUEZ</h1>
        <p>ROCK · ALMA · LEYENDA</p>
    </div>

    <div class="social-icons icons-right">
        <a href="#" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fa-brands fa-facebook"></i></a>
    </div>
</header>

<div class="page-title">
    <h2>Galería de Fotos</h2>
</div>

<nav class="nav-menu">
    <a href="index.html" class="btn">Inicio</a>
    <a href="galeria.html" class="btn">Galería de Fotos</a>
</nav>

<div class="container">
    <div class="grid-galeria">
        <div class="foto-card"><img src="foto1.jpg" alt="Foto 1"></div>
        <div class="foto-card"><img src="foto2.jpg" alt="Foto 2"></div>
        <div class="foto-card"><img src="foto3.jpg" alt="Foto 3"></div>
    </div>
</div>

<footer>
    <p>© 2026 Tony Vázquez. Todos los derechos reservados.</p>
</footer>

</body>
</html>
