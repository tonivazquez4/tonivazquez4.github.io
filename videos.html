            right: 30px;
            z-index: 99;
            font-size: 1.5rem;
            border: none;
            outline: none;
            background-color: var(--gold);
            color: black;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
