<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #d4af37; }
        body { font-family: 'Arial Black', sans-serif; margin: 0; padding: 0; color: white; background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; background-size: cover; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }
        
        header { display: grid; grid-template-columns: 200px 1fr 200px; align-items: center; border-bottom: 2px solid var(--gold); padding: 15px 40px; background: rgba(0,0,0,0.6); }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; margin: 0 7px; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); }
        .header-center { text-align: center; }
        .header-center h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 0; text-transform: uppercase; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 4px; font-weight: bold; font-size: 0.8rem; }

        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: var(--gold); color: black; padding: 10px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; transition: 0.3s; }
        .btn:hover { background: white; transform: scale(1.05); }

        .container { padding: 0 15px 20px; max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 40px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 2px solid var(--gold); border-radius: 10px; background: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Estilos del cajón de comentarios */
        .seccion-comentarios { max-width: 900px; margin: 20px auto 60px; padding: 20px; background: rgba(255, 255, 255, 0.95); border-radius: 10px; border: 2px solid var(--gold); }
        .seccion-comentarios h3 { color: black; text-align: center; margin-top: 0; font-size: 1.5rem; text-transform: uppercase; border-bottom: 2px solid #ccc; padding-bottom: 10px; }

        footer { padding: 30px; text-align: center; background: rgba(0,0,0,0.9); border-top: 1px solid #222; }

            bottom: 30px;
            right: 30px;
            z-index: 99;
            font-size: 1.5rem;
            border: none;
            outline: none;
            background-color: var(--gold);
            color: black;
            cursor: pointer;
            width: 50px;
