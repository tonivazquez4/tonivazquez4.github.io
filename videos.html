    <style>
        :root { --gold: #d4af37; --gold-light: #f9d976; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; background-size: cover; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%); z-index: -1; }
        
        header { height: auto; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 10px 40px; background: rgba(0,0,0,0.9); }
        .header-logo { height: 105px; width: auto; filter: brightness(0) saturate(100%) invert(75%) sepia(50%) saturate(600%) hue-rotate(5deg) brightness(90%) contrast(100%); cursor: pointer; transition: 0.3s; }
        #logo-izq { animation: giro-3d 6s linear infinite; }
        #logo-der { animation: giro-3d 6s linear infinite reverse; }
        @keyframes giro-3d { from { transform: perspective(1000px) rotateY(0deg); } to { transform: perspective(1000px) rotateY(360deg); } }
        
        /* REGLAS DE SIMETRÍA AÑADIDAS */
        .header-center { text-align: center; flex-grow: 1; }
        .header-center h1 { font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 0; text-transform: uppercase; text-shadow: 2px 2px 10px black; }
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 4px; font-weight: 700; font-size: 0.8rem; }

        .social-icons { display: flex; gap: 15px; width: 200px; }
        .icons-left { justify-content: flex-start; }
        .icons-right { justify-content: flex-end; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); transform: translateY(-3px); }
        
        .nav-menu { text-align: center; margin: 30px 0; }
        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; margin: 5px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn:hover, .btn.activo { background: white; transform: scale(1.05); }
        
        .container { padding: 0 15px 20px; max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 40px; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border: 2px solid #444; border-radius: 12px; background: black; transition: 0.4s; }
        .video-wrapper:hover { transform: translateY(-5px); border-color: var(--gold); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .seccion-comentarios { max-width: 800px; margin: 40px auto; padding: 20px; background: white; color: black; border-radius: 12px; border: 2px solid var(--gold); }
        
        /* ESTILOS DEL BACKSTAGE */
        .backstage-box { background: linear-gradient(45deg, #111, #222); border: 2px solid var(--gold); padding: 40px 20px; text-align: center; border-radius: 15px; margin: 50px auto; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .backstage-box h2 { color: var(--gold); text-transform: uppercase; margin-top: 0; margin-bottom: 10px; }
        .backstage-box p { color: #ccc; margin-bottom: 25px; font-size: 1.1rem; }
        .backstage-form { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .backstage-input { padding: 12px 20px; border-radius: 8px; border: 1px solid #444; background: #000; color: white; width: 300px; font-family: 'Montserrat', sans-serif; }
        .backstage-input:focus { outline: none; border-color: var(--gold); }
        .btn-subscribe { background: var(--gold); color: black; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-subscribe:hover { background: white; transform: scale(1.05); }

        footer { padding: 25px; text-align: center; background: #000; border-top: 2px solid #222; margin-top: 40px; }
        
        #btnSubir { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--gold); color: black; border: none; cursor: pointer; width: 55px; height: 55px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.6); justify-content: center; align-items: center; font-size: 1.5rem; transition: 0.3s; }
        
        /* ⚠️ REGLAS MÓVILES AJUSTADAS ⚠️ */
        @media (max-width: 768px) { 
            header { flex-direction: column; padding: 20px; gap: 15px; } 
            .header-logo { display: none; } 
            .social-icons { width: auto; justify-content: center; } /* Asegura el centrado móvil */
            .nav-menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; } 
            .btn { font-size: 0.75rem; padding: 8px 10px; } 
            .backstage-input { width: 100%; margin-bottom: 10px; }
        }
    </style>
