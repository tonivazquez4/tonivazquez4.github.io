    <style>
        :root { 
            --gold: #d4af37; 
            --gold-light: #f9d976; 
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; color: white; 
            background: #000 url('Alma de Rock.jpg') no-repeat center center fixed; 
            background-size: cover; 
        }
        
        body::before { 
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%); 
            z-index: -1; 
        }

        h1, h2, h3 { font-family: 'Arial Black', sans-serif; }
        
        header { 
            height: auto; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--gold); padding: 10px 40px; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.5)); 
        }
        
        /* ESTILO LOGOS DORADOS Y GIRO OPUESTO */
        .header-logo { 
            height: 105px; width: auto; 
            filter: brightness(0) saturate(100%) invert(75%) sepia(50%) saturate(600%) hue-rotate(5deg) brightness(90%) contrast(100%);
            cursor: pointer; transition: filter 0.3s ease;
        }

        #logo-izq { animation: giro-derecha 6s linear infinite; }
        #logo-der { animation: giro-izquierda 6s linear infinite; }

        @keyframes giro-derecha {
            from { transform: perspective(1000px) rotateY(0deg); }
            to { transform: perspective(1000px) rotateY(360deg); }
        }

        @keyframes giro-izquierda {
            from { transform: perspective(1000px) rotateY(360deg); }
            to { transform: perspective(1000px) rotateY(0deg); }
        }

        .header-logo:hover {
            filter: brightness(0) saturate(100%) invert(85%) sepia(30%) saturate(1000%) hue-rotate(10deg) brightness(110%) contrast(110%);
            animation-play-state: paused;
        }

        .social-icons { display: flex; gap: 15px; width: 200px; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--gold); transform: translateY(-3px); }
        
        .header-center { text-align: center; }
        .header-center h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 0; text-transform: uppercase; text-shadow: 2px 2px 10px black;}
        .header-center p { margin: 5px 0 0 0; color: var(--gold); letter-spacing: 4px; font-weight: 700; font-size: 0.8rem; }

        .nav-menu { text-align: center; margin: 30px 0; }
        
        .btn { 
            background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; 
            padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; 
            display: inline-block; margin: 5px; font-size: 0.95rem; transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        .btn:hover, .btn.activo { background: linear-gradient(45deg, #ffffff, #e0e0e0); transform: scale(1.05); }

        .container { padding: 0 15px 20px; max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 50px; }
        
        .video-wrapper { 
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; 
            border: 2px solid #444; border-radius: 12px; background: black; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.4s;
        }

        .video-wrapper:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4); border-color: var(--gold); }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .seccion-comentarios { 
            max-width: 800px; margin: 40px auto 60px; padding: 15px 20px; 
            background-color: #ffffff; 
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(240, 240, 240, 0.95)); 
            border-radius: 12px; border: 2px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .seccion-comentarios h3 { color: black; text-align: center; margin-top: 0; font-size: 1.3rem; text-transform: uppercase; border-bottom: 2px solid #ccc; padding-bottom: 10px; }

        footer { padding: 25px; text-align: center; background: #000; font-size: 0.9rem; border-top: 2px solid #222; }

        #btnSubir { 
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; 
            background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; 
            width: 55px; height: 55px; border-radius: 50%; border:none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 20px 10px; gap: 15px; height: auto; }
            .header-logo { display: none; }
            .social-icons { width: auto; justify-content: center; }
            .nav-menu { display: flex; flex-direction: row; justify-content: center; flex-wrap: nowrap; gap: 5px; padding: 0 5px; }
            .nav-menu .btn { width: auto; margin: 0; padding: 8px 10px; font-size: 0.75rem; }
        }
    </style>
