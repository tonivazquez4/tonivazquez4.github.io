<script>
    function cerrarBannerIos() {
        document.getElementById('ios-install-banner').style.display = 'none';
        localStorage.setItem('pwa_banner_closed_date', new Date().getTime());
    }

    window.onload = function() {
        cargarReacciones();
        const closedDate = localStorage.getItem('pwa_banner_closed_date');
        const now = new Date().getTime();
        if (!(closedDate && (now - closedDate < 7 * 24 * 60 * 60 * 1000)) && !window.matchMedia('(display-mode: standalone)').matches) {
            setTimeout(() => { document.getElementById('ios-install-banner').style.display = 'block'; }, 3000);
        }
    };

    window.onscroll = function() { 
        let btn = document.getElementById("btnSubir"); 
        btn.style.display = (document.documentElement.scrollTop > 400) ? "flex" : "none"; 
    };

    function cargarReacciones() {
        const api = 'https://abacus.jasoncameron.dev'; const site = 'tonyvazquez.es';
        ['fuego', 'cuernos', 'corazon'].forEach(tipo => {
            fetch(`${api}/get/${site}/react_${tipo}`).then(r => r.json()).then(d => { document.getElementById(`count-${tipo}`).innerText = d.value || 0; });
            if(localStorage.getItem(`voto_${tipo}`)) { document.getElementById(`count-${tipo}`).parentElement.classList.add('votado'); }
        });
    }

    function sumarReaccion(tipo, btn) {
        if(localStorage.getItem(`voto_${tipo}`)) return;
        localStorage.setItem(`voto_${tipo}`, 'true');
        btn.classList.add('votado');
        let span = document.getElementById(`count-${tipo}`);
        span.innerText = (parseInt(span.innerText) || 0) + 1;
        fetch(`https://abacus.jasoncameron.dev/hit/tonyvazquez.es/react_${tipo}`);
    }
</script>
