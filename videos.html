<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos | Tony Vázquez</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --gold: #d4af37; }
        body { font-family: 'Arial Black', sans-serif; margin: 0; padding: 0; color: white; background: url('Alma de Rock.jpg') no-repeat center center fixed; background-size: cover; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: -1; }
        
        header { height: 100px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding: 0 40px; }
        h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); color: white; text-transform: uppercase; margin: 0; }
        header p { margin: 2px 0 0; letter-spacing: 2px; font-size: 0.8rem; color: var(--gold); }
        .social-icons { display: flex; gap: 15px; width: 200px; }
        .social-icons a { color: white; font-size: 1.4rem; text-decoration: none; }

        .page-title { text-align: center; margin-top: 30px; }
        .page-title h2 { color: var(--gold); text-transform: uppercase; font-size: 2.2rem; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 5px; }
        
        .nav-menu { text-align: center; margin: 20px 0 40px; }
        .btn { background: var(--gold); color: black; padding: 8px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin: 5px; font-size: 0.9rem; }

        .container { padding: 0 15px 40px; max-width: 1000px; margin: auto; }
        
        /* CONTENEDOR DE VÍDEO REPSONSIVE */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 30px; border: 2px solid var(--gold); border-radius: 10px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        footer { padding: 20px; text-align: center; background: rgba(0,0,0,0.9); font-size: 0.8rem; border-top: 1px solid #222; }
    </style>
</head>
<body>

<header>
    <div class="social-icons">
        <a href="#"><i class="fa-brands fa-spotify"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>
    <div><h1>TONY VÁZQUEZ</h1><p>VÍDEOS</p></div>
    <div class="social-icons" style="justify-content: flex-end;">
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
</header>

<div class="page-title"><h2>Actuaciones</h2></div>

<nav class="nav-menu">
    <a href="index.html" class="btn">Inicio</a>
    <a href="galeria.html" class="btn">Galería</a>
    <a href="videos.html" class="btn">Vídeos</a>
</nav>

<div class="container">
    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/jbRyfHEIujA?si=p69x2wNJ8HhjMI9i" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/OTRO_ID" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<footer><p>© 2026 Tony Vázquez. Todos los derechos reservados.</p></footer>

</body>
</html>
