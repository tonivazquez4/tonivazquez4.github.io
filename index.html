    <style>
        :root { --gold: #d4af37; --gold-light: #f9d976; }
        body {

        .tour-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #333; }
        .tour-date { color: var(--gold); font-weight: bold; font-size: 1.2rem; min-width: 100px; }
        .tour-info { flex-grow: 1; padding: 0 20px; text-align: left; }

        @media (max-width: 600px) { .tour-item { flex-direction: column; text-align: center; } .tour-info { padding: 15px 0; } }
