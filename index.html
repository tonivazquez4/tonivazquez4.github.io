        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 1300px; margin: auto; }
        .foto-card { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid #333; background: #111; overflow: hidden; }
        .foto-card img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: 0.4s; }

        @media (min-width: 1024px) { .muro-rockero { max-width: 1000px; padding: 30px; } }
        #imageModal { display: none; position: fixed; z-index: 99999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); align-items: center; justify-content: center; }
        #imgFull { max-width: 95%; max-height: 85vh; border: 2px solid var(--gold); object-fit: contain; }
        .modal-btn { position: absolute; background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: white; font-size: 2rem; cursor: pointer; z-index: 100000; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        #prevBtn { left: 10px; } #nextBtn { right: 10px; } #closeBtn { top: 10px; right: 10px; }
        footer { text-align: center; padding: 30px; background: #000; border-top: 1px solid #222; font-size: 0.8rem; }
        #btnSubir { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: var(--gold); border: none; width: 50px; height: 50px; border-radius: 50%; justify-content: center; align-items: center; }

<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
<script>
    const totalFotos = 178; let fotoActual = 1;
    function cargarGaleria() { let contenido = ""; for (let i = 1; i <= totalFotos; i++) { contenido += `<div class="foto-card"><img src="Fotos/Foto ${i}.jpg" loading="lazy" onclick="abrirImagen(${i})"></div>`; } document.getElementById('galeria-fotos').innerHTML = contenido; }
    function abrirImagen(indice) { fotoActual = indice; actualizarImagenModal(); document.getElementById("imageModal").style.display = "flex"; document.body.style.overflow = "hidden"; }
    function cerrarModal() { document.getElementById("imageModal").style.display = "none"; document.body.style.overflow = "auto"; }
    function cambiarFoto(direccion) { fotoActual += direccion; if (fotoActual > totalFotos) fotoActual = 1; if (fotoActual < 1) fotoActual = totalFotos; actualizarImagenModal(); }
    function actualizarImagenModal() { document.getElementById("imgFull").src = `Fotos/Foto ${fotoActual}.jpg`; }
    function cerrarBannerIos() { document.getElementById('ios-install-banner').style.display = 'none'; localStorage.setItem('pwa_banner_closed_date', new Date().getTime()); }
    function compartirWeb() { if (navigator.share) { navigator.share({ title: 'Galería Tony Vázquez', url: window.location.href }); } }
    window.onload = function() {
        cargarGaleria();
        const closedDate = localStorage.getItem('pwa_banner_closed_date');
        if (!(closedDate && (new Date().getTime() - closedDate < 7 * 24 * 60 * 60 * 1000)) && !window.matchMedia('(display-mode: standalone)').matches) {
            setTimeout(() => { document.getElementById('ios-install-banner').style.display = 'block'; }, 3000);
        }
    };
    function sumarReaccion(tipo, btn) { if(localStorage.getItem(`voto_${tipo}`)) return; localStorage.setItem(`voto_${tipo}`, 'true'); btn.style.background = "var(--gold)"; btn.style.color = "black"; }
</script>
