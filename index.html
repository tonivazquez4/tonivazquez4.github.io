        .header-center { text-align: center; flex-grow: 1; }

        .btn { background: linear-gradient(45deg, var(--gold), var(--gold-light)); color: black; padding: 10px 22px; text-decoration: none; border-radius: 8px; font-weight: 700; display: inline-block; margin: 5px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .container { padding: 0 20px 40px; max-width: 1200px; margin: auto; }
        .discografia { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .album-card { background: rgba(20, 20, 20, 0.9); border: 1px solid #333; border-radius: 15px; overflow: hidden; text-align: center; padding-bottom: 20px; transition: 0.4s; }
        .album-img { width: 100%; height: 350px; object-fit: contain; background: black; padding-top: 10px; }

        /* BOTÓN SOLO CARRITO (SIN LETRAS) */
        .contenedor-tienda-derecha { display: flex; justify-content: flex-end; margin-top: 25px; padding: 0 10px; }
        .btn-carrito-solo {

            background: var(--gold); color: black; width: 60px; height: 60px; 
            border-radius: 50%; text-decoration: none; font-size: 1.5rem; 
            transition: 0.3s; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .btn-carrito-solo:hover { background: white; transform: scale(1.1); box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4); }

        #btnSubir { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: var(--gold); color: black; border: none; cursor: pointer; width: 55px; height: 55px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.6); justify-content: center; align-items: center; font-size: 1.5rem; transition: 0.3s; }
        
        @media (max-width: 768px) { 
            header { flex-direction: column; padding: 20px; gap: 15px; } 
            .header-logo { display: none; } 
            .contenedor-tienda-derecha { justify-content: center; }
