        /* ESTILOS PARA EL TRUCO DE LAS "FACHADAS" DE YOUTUBE */
        .youtube-facade { cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .youtube-facade img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.3s; }
        .youtube-facade .play-btn { position: relative; z-index: 2; color: #ff0000; font-size: 5rem; filter: drop-shadow(0 0 15px rgba(0,0,0,0.9)); transition: 0.3s; }
        .youtube-facade:hover img { opacity: 1; }
        .youtube-facade:hover .play-btn { transform: scale(1.1); color: white; }

<button id="btnSubir" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-arrow-up"></i></button>

<script>
    // 1. ELIMINACIÓN DE LA CACHÉ
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) { registration.unregister(); }
        });
    }

    window.onscroll = function() { 
        let btn = document.getElementById("btnSubir"); 
        if (document.documentElement.scrollTop > 400) btn.style.display = "flex"; else btn.style.display = "none"; 
    };

    // 2. ACTIVADOR DE REPRODUCTORES (Transforma las fotos en vídeos al hacer clic)
    document.querySelectorAll('.youtube-facade').forEach(fachada => {
        fachada.addEventListener('click', function() {
            let videoId = this.getAttribute('data-id');
            // Al hacer clic, borra la foto y clava el iframe real auto-reproduciéndose
            this.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            // Quita la clase para que no se vuelva a clickear
            this.classList.remove('youtube-facade');
        });
    });

    // 3. CARGA DE COMENTARIOS INVISIBLE (Se cargan 1 segundo después)
    setTimeout(() => {
        const api = 'https://abacus.jasoncameron.dev'; const site = 'tonyvazquez.es';
        ['fuego', 'cuernos', 'corazon'].forEach(tipo => {
            fetch(`${api}/get/${site}/react_${tipo}`)
                .then(r => r.json()).then(d => { document.getElementById(`count-${tipo}`).innerText = d.value || 0; }).catch(() => {});
            if(localStorage.getItem(`voto_${tipo}`)) document.getElementById(`count-${tipo}`).parentElement.classList.add('votado');
        });

        let scriptLang = document.createElement('script');
        scriptLang.src = "https://cusdis.com/js/widget/lang/es.js";
        scriptLang.async = true;
        document.body.appendChild(scriptLang);
        
        let scriptMain = document.createElement('script');
        scriptMain.src = "https://cusdis.com/js/cusdis.es.js";
        scriptMain.async = true;
        document.body.appendChild(scriptMain);
    }, 1000);

    function sumarReaccion(tipo, btn) {
        if(localStorage.getItem(`voto_${tipo}`)) return; localStorage.setItem(`voto_${tipo}`, 'true'); btn.classList.add('votado');
        let span = document.getElementById(`count-${tipo}`); span.innerText = (parseInt(span.innerText) || 0) + 1;
        fetch(`https://abacus.jasoncameron.dev/hit/tonyvazquez.es/react_${tipo}`).catch(() => {});
    }
</script>
